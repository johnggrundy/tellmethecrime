name: Install analytics loader
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-analytics-loader.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared analytics loader to all HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script defer src="/assets/js/analytics.js"></script>'
          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text()
              if tag in text:
                  continue
              if '</head>' not in text:
                  raise RuntimeError(f'Missing </head> in {path}')
              path.write_text(text.replace('</head>', tag + '\n</head>', 1))
              changed.append(str(path))
          print(f'Updated {len(changed)} HTML files')
          for path in changed:
              print(path)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TMTC site bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' 'episodes/*.html'
          git commit -m 'Load shared analytics script on all site pages'
          git push
